name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_OCTOPUS_REGION: C
          VITE_AGILE_PRODUCT: AGILE-24-10-01
          VITE_GAS_PRODUCT: SILVER-25-09-02
          VITE_WEATHER_LAT: 51.5074
          VITE_WEATHER_LON: -0.1278

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: agile-dashboard
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
