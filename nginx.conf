server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers, repeated in every location block below rather than
    # declared once here: nginx's `add_header` does not merge across nested
    # levels - a location that adds its own header replaces the inherited
    # set entirely, which used to silently drop these three for every static
    # asset. Flattening the asset location out of `location /` (it doesn't
    # need try_files) and repeating the headers in each block keeps that
    # from happening again.
    #
    # No X-Frame-Options: this dashboard is designed to be embedded (see the
    # Home Assistant iframe/webpage card guidance in README.md). A same-origin
    # frame-ancestors would block exactly that use case. Scope this to your
    # actual embedding origin if you want it locked down; '*' is left
    # permissive here because that origin isn't known at image-build time.

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "frame-ancestors *;" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "frame-ancestors *;" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache index.html and runtime-config.js
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "frame-ancestors *;" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location = /runtime-config.js {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "frame-ancestors *;" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
